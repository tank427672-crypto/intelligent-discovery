[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "intelligent-discovery"
version = "0.9.1"
description = "An extensible, evidence-led AI knowledge discovery ecosystem."
requires-python = ">=3.11"
readme = "README.md"
authors = [{name = "Intelligent Discovery Contributors"}]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "License :: Other/Proprietary License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "httpx>=0.27,<1.0", "ruff>=0.8,<1.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"intelligent_discovery/observability.py" = ["E501"]
"intelligent_discovery/response.py" = ["E501"]
"intelligent_discovery/evolution.py" = ["E501"]

[tool.setuptools.packages.find]
include = ["intelligent_discovery*"]
